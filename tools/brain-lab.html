<!doctype html>
<meta charset="utf-8">
<title>Brain lab</title>
<pre id="out">loading…</pre>
<script>document.write('<script src="../js/brain.js?v=' + Date.now() + '"><\/script>');</script>
<script>
FlyBrain.version = Date.now();
// Dev-only harness: drive one brain from the console / automation and measure responses.
const out = document.getElementById('out');
const log = s => { out.textContent += '\n' + s; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
window.lab = {};
FlyBrain.load('../').then(async () => {
  const q = new URLSearchParams(location.search);
  const b = new FlyBrain({ synWeight: +q.get('w') || 0, thresholdScale: q.get('kc') ? { KC: +q.get('kc') } : undefined });
  lab.b = b;
  while (!b.ready) { if (b.error) { log('ERR ' + b.error); return; } await sleep(50); }
  b.worker.postMessage({ type: 'setParams', tickRate: 60 });
  out.textContent = 'ready';
  // run inputs for n ticks, return mean firing fraction per group and total spikes
  lab.run = async (inputs, ticks, pulseEvery) => {
    b.hold(inputs || {});
    const sum = {}, start = b.ticks;
    let last = b.ticks;
    while (b.ticks - start < ticks) {
      await sleep(5);
      if (b.ticks !== last) {
        last = b.ticks;
        if (pulseEvery && (b.ticks - start) % pulseEvery.every === 0) b.pulse(pulseEvery.inputs);
        const f = b.history[b.history.length - 1];
        for (const k in f) sum[k] = (sum[k] || 0) + f[k];
      }
    }
    for (const k in sum) sum[k] /= ticks;
    return sum;
  };
  lab.A = { ORN_DM1: 0.25, ORN_DM2: 0.25, ORN_DM4: 0.25, ORN_VA2: 0.25 };
  lab.B = { ORN_DP1m: 0.25, ORN_DM3: 0.25, ORN_VM2: 0.25, ORN_VM3: 0.25 };
  // which Kenyon cells an input recruits after 20 ticks, plus MBON responses
  lab.kcSnap = async (inp) => {
    b.hold(inp); const start = b.ticks; while (b.ticks - start < 20) await sleep(4);
    b.probe = null; b.worker.postMessage({ type: 'probeKC' }); while (!b.probe) await sleep(4);
    const set = new Set(b.probe.kc); const on = await lab.run(inp, 10);
    b.hold({}); await lab.run({}, 150);
    return { set, ap: on.MBON_AP || 0, av: on.MBON_AV || 0 };
  };
  lab.sparse = async () => {
    b.worker.postMessage({ type: 'reset' }); await lab.run({}, 50);
    const a = await lab.kcSnap(lab.A), bb = await lab.kcSnap(lab.B);
    const inter = [...a.set].filter(k => bb.set.has(k)).length;
    return { kcA: a.set.size, kcB: bb.set.size, overlap: inter, apA: +(a.ap * 100).toFixed(2), apB: +(bb.ap * 100).toFixed(2), avA: +(a.av * 100).toFixed(2) };
  };
  lab.top = (res, n = 12) => Object.entries(res).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, n)
    .map(([k, v]) => k + '=' + (v * 100).toFixed(2) + '%').join(' ');
});
</script>
